<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080A0C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dad Athlete 92" />
  <title>Dad Athlete 92</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
</head>
<body>
  <div id="launchScreen" class="launch-screen">
    <img src="icon-512.png" alt="Dad Athlete 92" class="launch-logo" />
    <div class="launch-title">Dad Athlete 92</div>
    <div class="launch-subtitle">Build. Track. Progress.</div>
  </div>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">1 Oct to 31 Dec 2026</div>
        <h1>Dad Athlete 92</h1>
      </div>
      <div id="phaseBadge" class="phase-badge"></div>
    </header>

    <main>
      <section id="todayView" class="view active">
        <div class="hero card">
          <div class="hero-row">
            <div>
              <div id="todayDate" class="muted"></div>
              <h2 id="todayTitle"></h2>
              <p id="todaySubtitle" class="muted"></p>
            </div>
            <button id="completeDayBtn" class="primary-btn">Mark day complete</button>
          </div>
          <div class="progress-wrap">
            <div class="progress-meta">
              <span id="dayCounter"></span>
              <span id="progressPct"></span>
            </div>
            <div class="progress-track">
              <div id="progressBar" class="progress-bar"></div>
            </div>
          </div>
        </div>

        <div id="workoutContainer"></div>

        <div class="card">
          <h3>Daily basics</h3>
          <div class="check-grid">
            <label><input type="checkbox" id="nutritionCheck" /> Meals on plan</label>
            <label><input type="checkbox" id="creatineCheck" /> Creatine 5 g</label>
            <label><input type="checkbox" id="sleepCheck" /> Sleep 7 to 8 h</label>
          </div>
          <textarea id="dayNotes" placeholder="Notes, energy, pain, wins"></textarea>
        </div>
      </section>

      <section id="planView" class="view">
        <div class="card">
          <div class="section-head">
            <div>
              <div class="eyebrow">Full tracker</div>
              <h2>92-day plan</h2>
            </div>
            <select id="planFilter">
              <option value="all">All days</option>
              <option value="Foundation">Foundation</option>
              <option value="Build">Build</option>
              <option value="Athlete">Athlete</option>
            </select>
          </div>
          <div id="calendarList" class="calendar-list"></div>
        </div>
      </section>

      <section id="workoutsView" class="view">
        <div class="card">
          <div class="eyebrow">Exact programming</div>
          <h2>Workouts</h2>
          <div class="segmented" id="workoutTabs"></div>
          <div id="workoutReference"></div>
        </div>
      </section>

      <section id="progressView" class="view">
        <div class="card">
          <div class="eyebrow">Weekly check-in</div>
          <h2>Progress</h2>
          <div class="metric-grid">
            <div class="metric"><span>Start weight</span><strong>74 kg</strong></div>
            <div class="metric"><span>Start waist</span><strong>35.5 in</strong></div>
            <div class="metric"><span>Target</span><strong>80 kg</strong></div>
            <div class="metric"><span>Goal pace</span><strong>0.2 to 0.35 kg/wk</strong></div>
          </div>
          <div class="input-row">
            <input id="weightInput" type="number" step="0.1" placeholder="Weight kg" />
            <input id="waistInput" type="number" step="0.1" placeholder="Waist in" />
            <button id="saveProgressBtn" class="primary-btn">Save check-in</button>
          </div>
          <div id="progressLog"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button data-view="todayView" class="nav-btn active">Today</button>
      <button data-view="planView" class="nav-btn">Plan</button>
      <button data-view="workoutsView" class="nav-btn">Workouts</button>
      <button data-view="progressView" class="nav-btn">Progress</button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
